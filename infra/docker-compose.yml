# Local backing components for the ticket marketplace.
#
# Services are tagged with Compose profiles so a developer runs only what the current build step
# needs (R11). The active set comes from COMPOSE_PROFILES in infra/.env:
#
#   core  Kafka + PostgreSQL + Redis            ~1.1 GiB   build steps 1-5
#   obs   Zipkin + Prometheus                   ~0.5 GiB   build step 8
#   full  everything above + Elasticsearch      ~3.1 GiB   build step 6 onward
#
# `full` is six services, not the seven the brief lists. Eureka is absent deliberately: unlike
# everything here it is not a third-party server but a Spring Boot app this project builds, so it
# arrives in build step 7 alongside the gateway that is its only consumer (+384 MiB then).
#
# Every service declares a hard mem_limit. Their real purpose is failure isolation: without one, a
# container that grows drags the whole host into swap and everything degrades together with no
# signal saying which one caused it. With one, that container is OOM-killed (exit code 137) and
# every other component keeps serving. A loud attributable failure beats a slow global one (R10).

name: ticket-marketplace

# -------------------------------------------------------------------------------------------------
# STARTUP ORDERING (FR-013)
#
# FR-013 requires that a component with an ordering dependency waits for that dependency to report
# healthy. Of the six services below, NONE has one. That is a finding, not an omission, so it is
# recorded here rather than left as an absence a later reader mistakes for an oversight:
#
#   kafka, postgres, redis, elasticsearch   standalone backing stores; nothing to wait for
#   zipkin                                  STORAGE_TYPE=mem, so it owns its storage. Point it at
#                                           Elasticsearch instead and it WOULD need an edge
#   prometheus                              pull model. A scrape target that is down is a normal
#                                           reported condition, not a startup failure — surviving
#                                           targets that come and go is the whole design
#
# The environment's one genuine ordering dependency arrives with the topic provisioner in T045,
# which cannot create channels before the broker serves metadata.
#
# WHY the edges are not added speculatively anyway: a depends_on edge is not free, and its cost is
# not visible in the line that declares it. Verified against Compose v2.39.1 — if a service is
# active and a service it depends on is NOT enabled by any active profile, Compose rejects the
# ENTIRE project:
#
#   service "x" depends on undefined service "y": invalid compose project
#
# It does not auto-enable the dependency. So every edge silently couples two profiles, and each
# dependency's profile list must be a SUPERSET of its dependent's. Concretely: giving zipkin
# (obs, full) an edge to elasticsearch (full) would make `COMPOSE_PROFILES=obs` start nothing at
# all, with an error naming Elasticsearch — which nobody running the observability profile is
# thinking about. T045's kafka-init is safe because it shares kafka's exact tags, core and full.
#
# TRADEOFF: these six could be chained with depends_on to stagger startup and flatten the memory
# spike of everything booting at once under `full`. Rejected — that turns a memory-budget problem
# into a startup-latency one, serialising a boot that parallelises perfectly well, and the honest
# controls for memory are the per-container limits already set below. It would also leave a graph
# that no longer describes real dependencies, so the next reader could not trust the ones that are
# real. Startup waits for health at the command instead, via `up --wait` in the Makefile (T039).
# -------------------------------------------------------------------------------------------------

services:

  # ---------------------------------------------------------------------------------------------
  # Kafka — the message broker every saga message travels through.
  # ---------------------------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    profiles: ["core", "full"]
    ports:
      # Only the host listener is published. The controller and inter-broker listeners stay inside
      # the Compose network, where nothing outside needs to reach them.
      - "9092:9092"
    environment:
      # --- KRaft: no ZooKeeper (FR-014) ------------------------------------------------------
      # Combined mode runs the broker and the controller in one process. A production cluster
      # separates them so controller quorum survives broker restarts; a single-node local broker
      # has no quorum to protect, and the second process would cost another ~300 MiB (R7).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # WHY the cluster id is hardcoded rather than generated: KRaft stamps it into the data
      # directory on first start and refuses to start against a directory holding a different one.
      # A generated id would make every restart a coin flip between "works" and a cryptic metadata
      # mismatch, which is exactly what FR-015 and SC-005 measure. Fixed id plus `make down -v`
      # gives a reproducible reset.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

      # --- Listeners: the classic Kafka-in-Docker trap ----------------------------------------
      # A client does not keep talking to the address it bootstrapped against. The broker replies
      # with its ADVERTISED address and the client reconnects to that. So a single listener cannot
      # serve both worlds: advertise `kafka:9092` and host processes cannot resolve it; advertise
      # `localhost:9092` and containers resolve it to themselves.
      #
      # Two listeners solve it. Containers use INTERNAL (kafka:29092); processes on the host — the
      # services run from an IDE in steps 2-7, and the Testcontainers tests — use HOST
      # (localhost:9092). Same broker, two doors.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Single-broker settings --------------------------------------------------------------
      # These internal topics default to replication factor 3 and would fail to create on one
      # broker. TRADEOFF: replication factor 1 means no fault tolerance at all — a local
      # constraint, not a production topology, and called out as such in the README (R6).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Default is 3000ms, which makes every consumer group wait three seconds to form. Pointless
      # on a single node and it slows every test run.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # WHY auto-creation is off: a broker that creates topics on first reference creates them with
      # DEFAULT settings — one partition. That silently defeats FR-027's three-partition
      # requirement, and the failure is invisible: everything works, just without the concurrency
      # the load test is supposed to prove. Channels are provisioned explicitly in T044.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Both bounds are set deliberately. Since Java 10 the JVM reads its cgroup limit rather than
      # host memory, but defaults the heap to only 25% of it — so this container would otherwise
      # run a 192 MiB heap inside a 768 MiB limit and waste the rest. The heap also has to stay
      # well below the limit, because metaspace, thread stacks, direct byte buffers, and GC
      # structures all live outside it (R10).
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

    volumes:
      # Named rather than a bind mount, so the data directory is owned by the image's user and does
      # not depend on host uid mapping. `make down` removes it, which is what makes a reset clean.
      - kafka-data:/var/lib/kafka/data

    mem_limit: 768m
    mem_reservation: 512m
    # Equal to mem_limit, which forbids swapping entirely. On a machine whose swap is already
    # exhausted, a container that fails fast is far more useful than one that crawls (R10).
    memswap_limit: 768m

    healthcheck:
      # Readiness, not liveness (FR-012, R8). The process is listening long before it can serve
      # metadata; this asks the broker to answer a real API request, which is what a client will
      # need. Anything weaker — a port check, a `pgrep` — reports healthy while clients still fail.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      # KRaft formats its storage on first start, so the first run is slower than later ones.
      # start_period suppresses failures during that window rather than counting them toward
      # retries, so a slow first boot does not mark the container unhealthy.
      start_period: 30s

  # ---------------------------------------------------------------------------------------------
  # PostgreSQL — durable state. Orders and the outbox in step 2, reservations in step 3.
  # ---------------------------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    profiles: ["core", "full"]
    ports:
      - "5432:5432"
    environment:
      # Credentials in a committed file are fine here and nowhere else: this database is reachable
      # only from localhost, holds nothing but generated demo data, and secrets management is
      # explicitly out of scope for this project. A real deployment reads these from a secret store.
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    command:
      - postgres
      # Matches the container limit deliberately. shared_buffers is PostgreSQL's page cache and is
      # allocated up front, so it has to leave room for everything else inside 256 MiB (R10).
      - -c
      - shared_buffers=128MB
      # WHY lower than the default 100: PostgreSQL forks a backend process per connection, each
      # with its own memory, so a connection ceiling is a memory ceiling. Nothing here comes close
      # — three services with a default Hikari pool of 10 is 30 — and 1000 k6 users in step 9 hit
      # the gateway, not the database.
      - -c
      - max_connections=50
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 256m
    mem_reservation: 128m
    memswap_limit: 256m
    healthcheck:
      # pg_isready asks the server whether it is accepting connections, which is readiness rather
      # than liveness (R8). It matters more here than it looks: PostgreSQL starts, then runs crash
      # recovery, and only then accepts connections. A port check would pass during recovery and a
      # dependant starting on that signal would fail to connect.
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------------------------
  # Redis — the seat locks. The authority on whether a seat is free, right now.
  # ---------------------------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    profiles: ["core", "full"]
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --maxmemory
      - 64mb
      # THE most consequential line in this file. Redis's usual policy under memory pressure is to
      # evict something old to make room — sensible for a cache, catastrophic here. An evicted key
      # is a released seat lock, so a seat that is genuinely held silently becomes available and two
      # customers buy it. Nothing reports an error; the data is simply gone.
      #
      # noeviction makes Redis REFUSE the write instead. A booking then fails loudly, which is a bad
      # afternoon rather than a double-booked venue. When the failure modes are "reject a booking"
      # and "sell one seat twice", you choose the first every time.
      - --maxmemory-policy
      - noeviction
      # Snapshotting off. Seat locks carry a 120s TTL and are worthless after a restart — the
      # durable record is the Postgres reservation, which is exactly why the design splits them.
      # It also avoids the fork-to-save memory spike, which is a real hazard under a 96 MiB cap.
      - --save
      - ""
    mem_limit: 96m
    mem_reservation: 64m
    memswap_limit: 96m
    healthcheck:
      # PING is genuinely a readiness check for Redis: it is single-threaded, so an answer means the
      # server is free to serve. There is no equivalent of PostgreSQL's recovery phase where it
      # would answer while unable to work.
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------------------------
  # Elasticsearch — the CQRS read model. Not needed until build step 6, hence `full` only.
  # ---------------------------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    profiles: ["full"]
    ports:
      - "9200:9200"
    environment:
      # Skips the bootstrap checks a multi-node cluster runs, and stops it looking for peers that
      # will never appear.
      discovery.type: single-node
      # No TLS and no authentication. Localhost-only demo data, and leaving security on would mean
      # generating certificates before the first request — cost with no benefit at this scale.
      xpack.security.enabled: "false"
      # 42% of the container limit. Elasticsearch is unusually dependent on the memory it does NOT
      # get: Lucene memory-maps index segments and reads them through the OS page cache, which lives
      # outside the heap. A heap set near the limit starves the file cache and makes search slower,
      # not faster (R10).
      ES_JAVA_OPTS: -Xms640m -Xmx640m

      # WHY machine learning is off: ES 8 starts native ML processes that allocate OUTSIDE the JVM
      # heap, so they are invisible to -Xmx and land straight against the container cap. Nothing in
      # this project uses ML, so this is pure overhead removed from the tightest budget here.
      xpack.ml.enabled: "false"

      # Locking heap into RAM needs a memlock ulimit this compose file does not grant; asking for it
      # anyway makes the node refuse to start rather than degrade.
      bootstrap.memory_lock: "false"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    # 1.5 GiB, not the 1 GiB this started as. That original figure was MEASURED WRONG in T042:
    # Elasticsearch was OOM-killed during startup, `OOMKilled=true ExitCode=137`, before it ever
    # served a request.
    #
    # The arithmetic explains it. `-Xms640m` commits the whole heap up front, and outside it sit
    # metaspace, the code cache, thread stacks for the hundred-plus threads ES starts, Netty's
    # direct buffers, and GC structures — comfortably past 1 GiB before Lucene caches a single
    # segment. A 640 MiB heap was 62.5% of the old cap, where Elastic's own guidance is at most 50%
    # and less in a container.
    #
    # TRADEOFF: the alternative was keeping the 1 GiB cap and cutting the heap to 512m. Rejected
    # because it treats the symptom — off-heap demand is what overflowed, so a smaller heap buys
    # only the difference while making every search slower. Raising the cap is the honest fix, and
    # it costs 512 MiB in a profile that is optional until build step 6.
    mem_limit: 1536m
    mem_reservation: 1g
    memswap_limit: 1536m
    healthcheck:
      # ACCEPTS YELLOW. A single-node cluster assigns every primary shard and then cannot place a
      # single replica, because a replica on the same node would defend against nothing. So its
      # steady state is yellow — "all data available, no redundancy" — and it never reaches green.
      #
      # Insisting on green here is a classic single-node trap: startup hangs forever waiting for a
      # state that cannot occur, and the logs show a perfectly healthy cluster (R8).
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      # The slowest component to come up: a JVM start plus index recovery. quickstart.md calls it
      # out as the long pole under the `full` profile.
      retries: 20
      start_period: 60s

  # ---------------------------------------------------------------------------------------------
  # Zipkin — distributed tracing. Where a saga becomes one picture instead of six log files.
  # ---------------------------------------------------------------------------------------------
  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: zipkin
    profiles: ["obs", "full"]
    ports:
      - "9411:9411"
    environment:
      # In-memory storage. Traces are lost on restart, which is right for a demo: they are
      # diagnostic breadcrumbs, not records, and the alternative is running a storage backend to
      # keep data nobody reads twice.
      STORAGE_TYPE: mem
      # MaxRAMPercentage rather than a fixed -Xmx. The JVM reads the cgroup limit, so one setting
      # stays correct if mem_limit changes — but the default is 25%, which would leave a 64 MiB heap
      # in a 256 MiB container. 65% is the explicit override (R10).
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    mem_limit: 256m
    mem_reservation: 128m
    memswap_limit: 256m
    healthcheck:
      # wget rather than curl: this image is Alpine-based, so busybox wget is present and curl is
      # not. --spider fetches headers only, which is all a health probe needs.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------------------------
  # Prometheus — metrics. Scrapes /actuator/prometheus from each service, starting at build step 8.
  # ---------------------------------------------------------------------------------------------
  prometheus:
    # The -busybox variant deliberately, not the plain tag. Prometheus also publishes a distroless
    # image, which has no shell and no wget — and the health probe below needs one. Choosing the
    # variant explicitly beats discovering the difference through a container that is permanently
    # unhealthy.
    image: prom/prometheus:v3.13.2-busybox
    container_name: prometheus
    profiles: ["obs", "full"]
    ports:
      - "9090:9090"
    volumes:
      # Read-only: Prometheus never needs to write its own configuration, and :ro means a bug or a
      # bad reload cannot rewrite the file on the host.
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Six hours. The default is fifteen days of metrics on disk, which is storage this project has
      # no use for — nobody is investigating last Tuesday on a local demo.
      - --storage.tsdb.retention.time=6h
    extra_hosts:
      # WHY this line is here and not on any other service: Prometheus is the one component that
      # initiates connections OUT to the services it monitors, and in build steps 2-7 those run on
      # the host from an IDE rather than in a container. From inside a container, `localhost` is the
      # container itself, so a scrape target of localhost:8081 finds nothing.
      #
      # host.docker.internal resolves to the host. Docker Desktop provides it automatically; the
      # native Linux engine does NOT, so it has to be declared explicitly (R9). Omitting it produces
      # scrapes failing with "no such host" on a machine where the same config works for a colleague
      # on Docker Desktop — a difference in the runtime masquerading as a configuration bug.
      - "host.docker.internal:host-gateway"
    mem_limit: 256m
    mem_reservation: 128m
    memswap_limit: 256m
    healthcheck:
      # /-/healthy is Prometheus's own readiness endpoint. wget, because this image is busybox-based.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------------------------
  # kafka-init — creates the fourteen message channels, then exits. Not a component; a job.
  # ---------------------------------------------------------------------------------------------
  kafka-init:
    # The broker's own image, reused rather than adding a smaller one. It already carries the
    # kafka-topics CLI and is guaranteed to be version-matched to the broker, and it is cached
    # locally by the time this runs — so reuse costs nothing and a second image would.
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-init

    # PROFILE "init", NOT "core"/"full", and this is the one place the plan was deviated from.
    #
    # `make up` passes `--wait`, which blocks until every started container is healthy. A container
    # that EXITS is neither running nor healthy, and Compose cannot tell "finished its job" from
    # "died" — so `--wait` fails the whole command even on exit code 0. Measured against Compose
    # v2.39.1:
    #
    #     container probe-init-1 exited (0)
    #     EXIT=1
    #
    # Tagged core/full, this job would therefore make every single `make up` report failure after a
    # completely successful startup. Out of those profiles, `up --wait` never sees it, and `make up`
    # invokes it explicitly afterwards with `compose run`, which DOES propagate its exit code
    # (verified: a job exiting 3 makes the command exit 3). So provisioning still fails loudly.
    #
    # The alternative that also works is having some other service declare
    # `depends_on: {kafka-init: {condition: service_completed_successfully}}`, which teaches Compose
    # that the exit was expected. Rejected: no component here consumes channels, so it would mean
    # inventing a service purely to satisfy a flag. Keeping it out of the profiles also keeps
    # `make health` honest — a job that has finished is not a component whose health can be
    # reported, and `config --services` never offers it to that target.
    profiles: ["init"]

    # The environment's ONLY genuine startup ordering dependency (T038). Channels cannot be created
    # before the broker can serve metadata, and `service_healthy` reads the broker's own readiness
    # probe rather than merely waiting for its container to exist.
    depends_on:
      kafka:
        condition: service_healthy

    volumes:
      # Read-only: the job runs the script, it does not edit it.
      - ./kafka-init:/opt/kafka-init:ro

    environment:
      # The INTERNAL listener. This container is inside the Compose network, so `localhost` would
      # be itself and `localhost:9092` would find nothing.
      BOOTSTRAP_SERVER: kafka:29092

    command: ["bash", "/opt/kafka-init/create-topics.sh"]

    # Explicit, because the default is to restart on failure — which for a job means retrying
    # forever instead of reporting that provisioning failed.
    restart: "no"

    mem_limit: 256m
    memswap_limit: 256m

    # TRADEOFF: every channel this job creates gets REPLICATION FACTOR 1 — one copy of each
    # partition, on the only broker there is. It is not a choice so much as the consequence of a
    # single-node broker: a replication factor above 1 needs additional brokers to place the
    # replicas on, and topic creation fails outright rather than degrading.
    #
    # What that costs, stated plainly rather than left implied: there is NO fault tolerance. If the
    # broker's volume is lost, every message in every channel is lost with it, and no consumer can
    # recover them. A production topology runs at least three brokers with replication factor 3 and
    # `min.insync.replicas=2`, so a broker can fail without losing acknowledged writes.
    #
    # It is the right call here and only here: this environment holds generated demo data, `make
    # down` deletes its volumes on purpose (FR-015), and the alternative costs two more brokers at
    # roughly 768 MiB each — tripling the memory budget to protect data the project throws away
    # every teardown. The same reasoning covers the broker's own internal topics above (R6).
    #
    # Documented for operators in infra/README.md under "Message channels", because `--describe`
    # shows `ReplicationFactor: 1` and a reader should find out why there rather than guessing.

    # TRADEOFF: R4 specified `NewTopic` beans, letting Spring's KafkaAdmin create the channels at
    # application startup with idempotency handled for free. Rejected because of ordering: FR-020
    # requires the fourteen channels to exist "once the environment is running", and SC-009 checks
    # them on a freshly started environment — but at build step 1 no Spring application exists yet,
    # and none will until step 2. Provisioning through a bean would make environment startup depend
    # on a built jar, which is the chicken-and-egg this file exists to avoid.
    #
    # The cost is real and worth naming: channel names now live in TWO places, this script and
    # Topics.java, with nothing enforcing agreement. Scenario 5 in quickstart.md is the guard — it
    # lists the channels and counts fourteen. Once the services exist, `NewTopic` beans can be added
    # alongside this script; they are idempotent, so the two would not conflict.

volumes:
  kafka-data:
  postgres-data:
  elasticsearch-data:
